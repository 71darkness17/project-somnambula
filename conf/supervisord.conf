[unix_http_server]
file=/var/run/supervisor.sock
chmod=0777
chown=nobody:nogroup

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info


[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock


[program:rsyslog]
command=/usr/sbin/rsyslogd -n
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/rsyslog_stdout.log
stderr_logfile=/var/log/supervisor/rsyslog_stderr.log
                                                       
[program:somn]
command=/usr/sbin/somnd
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/somn_stdout.log
stderr_logfile=/var/log/supervisor/somn_stderr.log
stopwaitsecs=30
stopsignal=TERM

